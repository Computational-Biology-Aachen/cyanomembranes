[project]
dependencies = ["biopython>=1.87,<2"]
name = "cyanomembranes"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
cyanomembranes = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.13.7.*"
matplotlib = ">=3.10.9,<4"
shapely = ">=2.1.2,<3"
numpy = ">=2.4.3,<3"
pandas = ">=3.0.2,<4"
jupyter = ">=1.1.1,<2"
rasterio = ">=1.4.4,<2"
scikit-learn = ">=1.8.0,<2"
scipy = ">=1.17.1,<2"
affine = ">=2.4.0,<3"
scikit-image = ">=0.26.0,<0.27"
numba = ">=0.65.1,<0.66"
tqdm = ">=4.67.3,<5"

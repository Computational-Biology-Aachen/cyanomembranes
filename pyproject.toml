[project]
name = "cyanomembranes"
version = "0.1.0"
requires-python = ">= 3.12"
dependencies = [
    "biopython>=1.87,<2",
    "matplotlib>=3.10.9,<4",
    "shapely>=2.1.2,<3",
    "numpy>=2.4.3,<3",
    "pandas>=3.0.2,<4",
    "rasterio>=1.4.4,<2",
    "scikit-learn>=1.8.0,<2",
    "scipy>=1.17.1,<2",
    "affine>=2.4.0,<3",
    "scikit-image>=0.26.0,<0.27",
    "numba>=0.65.1,<0.66",
    "tqdm>=4.67.3,<5",
    "joblib",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1,<2",
    "pre-commit>=4.6.0,<5",
    "celluloid>=0.2.0,<0.3",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pandas-stubs>=3.0.5.260914",
    "types-shapely>=2.1.0.20260728",
    "types-tqdm>=4.70.0.20260906",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PD"]

[tool.mypy]
strict = false

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "affine.*",
    "rasterio.*",
    "numba.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

